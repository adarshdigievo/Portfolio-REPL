    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@3.14.5/dist/xterm.css"/>
    <style>
        :root {
            --page-bg: #000000;
            --terminal-fg: #ffffff;
            --accent: #2aa342;
            --accent-strong: #8aff80;
            --chip-bg: #071307;
            --chip-hover: #123018;
            --chip-fg: #d7ffd9;
            --bar-bg: rgba(0, 0, 0, 0.94);
        }

        html,
        body {
            background-color: var(--page-bg);
            margin: 0;
            min-height: 100%;
        }

        #terminal {
            box-sizing: border-box;
            height: calc(100dvh - 84px) !important;
            margin: 8px;
            opacity: 0;
            transition: opacity 160ms ease;
            width: calc(100% - 16px);
        }

        #terminal.is-ready {
            opacity: 1;
        }

        .boot-loader {
            align-items: center;
            background: var(--page-bg);
            color: var(--accent-strong);
            display: flex;
            font-family: courier-new, courier, monospace;
            inset: 0;
            justify-content: center;
            position: fixed;
            z-index: 10;
        }

        .boot-loader.is-hidden {
            display: none;
        }

        .boot-loader__cursor {
            animation: blink 1s steps(2, start) infinite;
        }

        @keyframes blink {
            to {
                visibility: hidden;
            }
        }

        .command-suggestions {
            align-items: center;
            background: var(--bar-bg);
            border: 1px solid var(--accent);
            bottom: 8px;
            box-sizing: border-box;
            display: flex;
            gap: 8px;
            left: 8px;
            min-height: 52px;
            overflow-x: auto;
            padding: 8px;
            position: fixed;
            right: 8px;
            z-index: 5;
            scrollbar-width: none;
        }

        .command-suggestions::-webkit-scrollbar {
            display: none;
        }

        .command-suggestions button {
            background: var(--chip-bg);
            border: 1px solid var(--accent);
            border-radius: 4px;
            color: var(--chip-fg);
            cursor: pointer;
            flex: 0 0 auto;
            font-family: courier-new, courier, monospace;
            font-size: 13px;
            min-height: 34px;
            padding: 0 10px;
            white-space: nowrap;
        }

        .command-suggestions button:hover,
        .command-suggestions button:focus-visible {
            background: var(--chip-hover);
            outline: none;
        }

        .mobile-keyboard {
            background: var(--bar-bg);
            border: 1px solid var(--accent);
            bottom: 8px;
            box-sizing: border-box;
            display: none;
            gap: 7px;
            left: 8px;
            padding: 8px;
            position: fixed;
            right: 8px;
            z-index: 7;
        }

        .mobile-keyboard__shortcuts {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .mobile-keyboard__shortcuts::-webkit-scrollbar {
            display: none;
        }

        .mobile-keyboard__row {
            display: grid;
            gap: 5px;
            grid-template-columns: repeat(10, minmax(0, 1fr));
        }

        .mobile-keyboard__row--symbols {
            grid-template-columns: repeat(10, minmax(0, 1fr));
        }

        .mobile-keyboard__row--lower-controls {
            grid-auto-rows: minmax(34px, auto);
        }

        .mobile-keyboard__key {
            align-items: center;
            background: var(--chip-bg);
            border: 1px solid var(--accent);
            border-radius: 4px;
            color: var(--chip-fg);
            cursor: pointer;
            display: flex;
            font-family: courier-new, courier, monospace;
            font-size: 13px;
            justify-content: center;
            min-height: 34px;
            padding: 0 6px;
            white-space: nowrap;
        }

        .mobile-keyboard__key--wide {
            grid-column: span 2;
        }

        .mobile-keyboard__key--icon {
            font-size: 18px;
            line-height: 1;
        }

        .mobile-keyboard__key--accent {
            background: var(--accent);
            border-color: var(--accent-strong);
            color: var(--page-bg);
            font-weight: 700;
        }

        .mobile-keyboard__key--enter {
            grid-column: 10;
            grid-row: 1 / span 2;
        }

        .mobile-keyboard__key--space {
            grid-column: span 3;
        }

        .mobile-keyboard__key:hover,
        .mobile-keyboard__key:focus-visible {
            background: var(--chip-hover);
            outline: none;
        }

        .mobile-keyboard__key--accent:hover,
        .mobile-keyboard__key--accent:focus-visible {
            background: var(--accent-strong);
            color: var(--page-bg);
        }

        .xterm-viewport {
            scrollbar-color: var(--accent) var(--page-bg);
            scrollbar-width: thin;
        }

        .xterm-viewport::-webkit-scrollbar {
            width: 8px;
        }

        .xterm-viewport::-webkit-scrollbar-track {
            background: var(--page-bg);
        }

        .xterm-viewport::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 0;
        }

        .repl-assistant {
            align-items: flex-start;
            bottom: 76px;
            display: flex;
            gap: 8px;
            max-width: min(390px, calc(100vw - 24px));
            position: fixed;
            right: 16px;
            z-index: 6;
        }

        .repl-assistant.is-collapsed .repl-assistant__bubble {
            display: none;
        }

        .repl-assistant__avatar {
            align-items: center;
            background: var(--chip-bg);
            border: 1px solid var(--accent);
            border-radius: 4px;
            color: var(--accent-strong);
            cursor: pointer;
            display: flex;
            flex: 0 0 auto;
            font-family: courier-new, courier, monospace;
            font-size: 12px;
            height: 42px;
            justify-content: center;
            line-height: 1;
            padding: 0;
            width: 42px;
        }

        .repl-assistant__bubble {
            background: var(--chip-bg);
            border: 1px solid var(--accent);
            border-radius: 4px;
            color: var(--chip-fg);
            font-family: courier-new, courier, monospace;
            font-size: 12px;
            line-height: 1.35;
            padding: 8px;
        }

        .repl-assistant__actions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 7px;
        }

        .repl-assistant__tip-row {
            align-items: center;
            display: flex;
            gap: 6px;
        }

        .repl-assistant__actions button,
        .repl-assistant__close,
        .repl-assistant__nav {
            background: transparent;
            border: 1px solid var(--accent);
            border-radius: 4px;
            color: var(--chip-fg);
            cursor: pointer;
            font-family: courier-new, courier, monospace;
            font-size: 12px;
            min-height: 28px;
            padding: 0 8px;
        }

        .repl-assistant__nav {
            flex: 0 0 auto;
            font-size: 16px;
            min-height: 26px;
            padding: 0;
            width: 28px;
        }

        .repl-assistant__close {
            float: right;
            margin-left: 8px;
            min-height: 22px;
            padding: 0 6px;
        }

        @media (max-width: 520px) {
            #terminal {
                height: calc(100dvh - 332px) !important;
            }

            .command-suggestions {
                display: none;
            }

            .mobile-keyboard {
                display: grid;
            }

            .repl-assistant {
                bottom: 320px;
                left: auto;
                max-width: min(320px, calc(100vw - 24px));
                right: 16px;
            }

            .repl-assistant__bubble {
                max-height: 110px;
                overflow: auto;
            }
        }
    </style>

<body>
    <div id="boot-loader" class="boot-loader">Starting Python REPL<span class="boot-loader__cursor">_</span></div>
    <div id="terminal"></div>
    <div id="repl-assistant" class="repl-assistant">
        <button type="button" class="repl-assistant__avatar" aria-label="Toggle REPL assistant">REPL<br>?</button>
        <div class="repl-assistant__bubble">
            <button type="button" class="repl-assistant__close" aria-label="Hide assistant">x</button>
            <div class="repl-assistant__tip-row">
                <button type="button" class="repl-assistant__nav" data-tip-direction="previous" aria-label="Previous suggestion">&lsaquo;</button>
                <div class="repl-assistant__text">Try `help()`, use Tab to complete commands, or switch themes.</div>
                <button type="button" class="repl-assistant__nav" data-tip-direction="next" aria-label="Next suggestion">&rsaquo;</button>
            </div>
            <div class="repl-assistant__actions">
                <button type="button" class="repl-assistant__primary" data-command="help()">help()</button>
            </div>
        </div>
    </div>
    <div class="command-suggestions" aria-label="Suggested commands">
        <button type="button" data-command="help()">help()</button>
        <button type="button" data-command="clear()">clear()</button>
        <button type="button" data-command="print(ABOUT)">print(ABOUT)</button>
        <button type="button" data-command="print(SKILLS)">print(SKILLS)</button>
        <button type="button" data-command="print(EXPERIENCE)">print(EXPERIENCE)</button>
        <button type="button" data-command="VISIT.GALLERY">VISIT.GALLERY</button>
        <button type="button" data-command="theme(amber)">theme("amber")</button>
        <button type="button" data-command="theme(light)">theme("light")</button>
    </div>
    <div class="mobile-keyboard" aria-label="Mobile Python keyboard">
        <div class="mobile-keyboard__shortcuts">
            <button type="button" class="mobile-keyboard__key" data-command="help()">help()</button>
            <button type="button" class="mobile-keyboard__key" data-command="print(ABOUT)">ABOUT</button>
            <button type="button" class="mobile-keyboard__key" data-command="print(SKILLS)">SKILLS</button>
            <button type="button" class="mobile-keyboard__key" data-command="print(EXPERIENCE)">EXPERIENCE</button>
            <button type="button" class="mobile-keyboard__key" data-command="clear()">clear()</button>
        </div>
        <div class="mobile-keyboard__row mobile-keyboard__row--symbols">
            <button type="button" class="mobile-keyboard__key" data-key="(">(</button>
            <button type="button" class="mobile-keyboard__key" data-key=")">)</button>
            <button type="button" class="mobile-keyboard__key" data-key="&quot;">"</button>
            <button type="button" class="mobile-keyboard__key" data-key="'">'</button>
            <button type="button" class="mobile-keyboard__key" data-key="_">_</button>
            <button type="button" class="mobile-keyboard__key" data-key=".">.</button>
            <button type="button" class="mobile-keyboard__key" data-key=",">,</button>
            <button type="button" class="mobile-keyboard__key" data-key="=">=</button>
            <button type="button" class="mobile-keyboard__key" data-key=":">:</button>
            <button type="button" class="mobile-keyboard__key" data-key="#">#</button>
        </div>
        <div class="mobile-keyboard__row">
            <button type="button" class="mobile-keyboard__key" data-key="1">1</button>
            <button type="button" class="mobile-keyboard__key" data-key="2">2</button>
            <button type="button" class="mobile-keyboard__key" data-key="3">3</button>
            <button type="button" class="mobile-keyboard__key" data-key="4">4</button>
            <button type="button" class="mobile-keyboard__key" data-key="5">5</button>
            <button type="button" class="mobile-keyboard__key" data-key="6">6</button>
            <button type="button" class="mobile-keyboard__key" data-key="7">7</button>
            <button type="button" class="mobile-keyboard__key" data-key="8">8</button>
            <button type="button" class="mobile-keyboard__key" data-key="9">9</button>
            <button type="button" class="mobile-keyboard__key" data-key="0">0</button>
        </div>
        <div class="mobile-keyboard__row">
            <button type="button" class="mobile-keyboard__key" data-key="q">q</button>
            <button type="button" class="mobile-keyboard__key" data-key="w">w</button>
            <button type="button" class="mobile-keyboard__key" data-key="e">e</button>
            <button type="button" class="mobile-keyboard__key" data-key="r">r</button>
            <button type="button" class="mobile-keyboard__key" data-key="t">t</button>
            <button type="button" class="mobile-keyboard__key" data-key="y">y</button>
            <button type="button" class="mobile-keyboard__key" data-key="u">u</button>
            <button type="button" class="mobile-keyboard__key" data-key="i">i</button>
            <button type="button" class="mobile-keyboard__key" data-key="o">o</button>
            <button type="button" class="mobile-keyboard__key" data-key="p">p</button>
        </div>
        <div class="mobile-keyboard__row">
            <button type="button" class="mobile-keyboard__key" data-key="a">a</button>
            <button type="button" class="mobile-keyboard__key" data-key="s">s</button>
            <button type="button" class="mobile-keyboard__key" data-key="d">d</button>
            <button type="button" class="mobile-keyboard__key" data-key="f">f</button>
            <button type="button" class="mobile-keyboard__key" data-key="g">g</button>
            <button type="button" class="mobile-keyboard__key" data-key="h">h</button>
            <button type="button" class="mobile-keyboard__key" data-key="j">j</button>
            <button type="button" class="mobile-keyboard__key" data-key="k">k</button>
            <button type="button" class="mobile-keyboard__key" data-key="l">l</button>
            <button type="button" class="mobile-keyboard__key mobile-keyboard__key--icon mobile-keyboard__key--accent" data-action="backspace" aria-label="Delete">&#9003;</button>
        </div>
        <div class="mobile-keyboard__row mobile-keyboard__row--lower-controls">
            <button type="button" class="mobile-keyboard__key mobile-keyboard__key--wide" data-action="shift">Shift</button>
            <button type="button" class="mobile-keyboard__key" data-key="z">z</button>
            <button type="button" class="mobile-keyboard__key" data-key="x">x</button>
            <button type="button" class="mobile-keyboard__key" data-key="c">c</button>
            <button type="button" class="mobile-keyboard__key" data-key="v">v</button>
            <button type="button" class="mobile-keyboard__key" data-key="b">b</button>
            <button type="button" class="mobile-keyboard__key" data-key="n">n</button>
            <button type="button" class="mobile-keyboard__key" data-key="m">m</button>
            <button type="button" class="mobile-keyboard__key mobile-keyboard__key--icon mobile-keyboard__key--accent mobile-keyboard__key--enter" data-action="enter" aria-label="Enter">&#9166;</button>
            <button type="button" class="mobile-keyboard__key" data-action="left">&lsaquo;</button>
            <button type="button" class="mobile-keyboard__key" data-action="right">&rsaquo;</button>
            <button type="button" class="mobile-keyboard__key" data-action="tab">Tab</button>
            <button type="button" class="mobile-keyboard__key mobile-keyboard__key--space" data-action="space">Space</button>
            <button type="button" class="mobile-keyboard__key" data-key="/">/</button>
            <button type="button" class="mobile-keyboard__key" data-key="-">-</button>
            <button type="button" class="mobile-keyboard__key" data-key="+">+</button>
        </div>
    </div>
    <script type="py" config="./configs/py-config.toml" src="./scripts/py/index.py"></script>
</body>
</html>
